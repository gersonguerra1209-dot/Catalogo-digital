<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo</title>
<meta name="theme-color" content="#0b0710">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
// cada loja tem seu próprio "aplicativo" para o cliente instalar
window.SB_PUBLICO = true;
(function () {
  var q = new URLSearchParams(location.search).get("l");
  var s = (q || decodeURIComponent(location.pathname.split("/").filter(Boolean)[0] || "")).toLowerCase();
  if (/^[a-z0-9-]{3,40}$/.test(s)) { var l = document.createElement("link"); l.rel = "manifest"; l.href = "/.netlify/functions/manifest?slug=" + encodeURIComponent(s); document.head.appendChild(l); }
  window.__instalar = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__instalar = e; var b = document.getElementById("instBox"); if (b) b.style.display = ""; });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/comum.js"></script>
</head>
<body class="vitrine">
<div class="wrap" id="app">
  <div class="centro" id="carregando"><div style="font-size:40px">✦</div><div style="color:var(--mut)">Abrindo a vitrine...</div></div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const CORES2 = ["#1fae5b","#e0457f","#2fb3c9","#e09a3a","#5a2fd6","#b03a6e","#8a5428","#2b9fb5"];
let L = null, P = [], filtro = "todos", R1 = { rot: 0 }, R2 = { rot: 0 }, girando = false, girando2 = false, RODA = [];

function slugAtual() {
  const q = new URLSearchParams(location.search).get("l");
  const bruto = q || decodeURIComponent(location.pathname.split("/").filter(Boolean)[0] || "");
  return bruto.toLowerCase().replace(/[^a-z0-9-]/g, ""); // limpa sobras que o Instagram/WhatsApp às vezes colam no link
}

function indisponivel(msg) {
  $("app").innerHTML = `<div class="centro"><div style="font-size:46px">🕯️</div><h2 style="font-family:'Cormorant Garamond',serif;font-size:28px">${msg}</h2><p style="color:var(--mut);font-size:14px">Fale com a loja pelo Instagram ou WhatsApp.</p></div>`;
}

async function iniciar() {
  const slug = slugAtual();
  if (!slug) return indisponivel("Catálogo não encontrado");
  // internet fraca: tenta até 3 vezes antes de desistir
  let loja = null, error = null;
  for (let t = 0; t < 3; t++) {
    ({ data: loja, error } = await sb.from("lojas").select("*").eq("slug", slug).maybeSingle());
    if (!error) break;
    await new Promise(r => setTimeout(r, 1200 * (t + 1)));
  }
  if (error) {
    $("app").innerHTML = `<div class="centro"><div style="font-size:46px">📶</div><h2 style="font-family:'Cormorant Garamond',serif;font-size:28px">A internet oscilou</h2><p style="color:var(--mut);font-size:14px">Não consegui abrir a vitrine agora.</p><button class="btn gold" onclick="location.reload()" style="max-width:260px;margin:14px auto 0">🔄 Tentar de novo</button></div>`;
    return;
  }
  if (!loja) return indisponivel("Catálogo indisponível");
  L = loja;
  if (new Date(L.ativo_ate + "T23:59:59") < new Date()) return indisponivel("Catálogo indisponível no momento");
  const { data: perf } = await sb.from("perfumes").select("*").eq("loja_id", L.id).order("criado_em", { ascending: false });
  P = perf || [];
  document.title = L.nome + " — Catálogo";
  montar();
  try { if (!sessionStorage.getItem("v_" + L.id)) { sessionStorage.setItem("v_" + L.id, "1"); sb.rpc("registrar_visita", { p_loja: L.id }).then(() => {}); } } catch (e) {}
  carregarStats();
  const h = location.hash.match(/^#p-(.+)$/); if (h && P.find(p => p.id === h[1])) abrir(h[1]);
}

async function carregarStats() {
  const { data } = await sb.rpc("stats_publicas", { p_loja: L.id });
  if (data) { $("sPerf").textContent = data.perfumes; $("sVend").textContent = data.vendas; $("sVis").textContent = data.visitas; }
}

const temGeo = () => L.lat != null && L.lng != null;
function mapsHref() {
  if (temGeo()) return `https://www.google.com/maps/dir/?api=1&destination=${L.lat},${L.lng}`;
  return /^https?:\/\//.test(L.maps_url) ? L.maps_url : "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(L.endereco || L.nome);
}
function mapaEmbed() {
  if (!temGeo()) return "";
  const d = 0.004, bb = [L.lng - d, L.lat - d * 0.7, L.lng + d, L.lat + d * 0.7].join(",");
  return `<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${bb}&layer=mapnik&marker=${L.lat},${L.lng}" style="width:100%;height:220px;border:0;border-radius:14px;margin-top:12px" loading="lazy" title="Mapa da loja"></iframe>`;
}

function montar() {
  const ab = lojaAberta(L);
  $("app").innerHTML = `
  <div class="top">
    <div class="logo">✦ ${esc(L.nome)}</div>
    <div class="tabs"><button class="tab on" data-v="per">Perfil</button><button class="tab tabcat" data-v="cat">🛍️ Catálogo</button></div>
  </div>
  <section id="per" class="panel on">
    <div class="cover" id="cover"></div>
    <div class="pcard">
      <div class="avatar"><div>${L.logo_url ? `<img src="${esc(L.logo_url)}" alt="">` : esc(iniciais(L.nome))}</div></div>
      <div class="pname">${esc(L.nome)}</div>
      <div class="psub">Perfumaria${L.endereco ? " • " + esc(L.endereco.split("—").pop().trim()) : ""}</div>
      <span class="aberto${ab ? "" : " f"}">${ab ? "🟢 Aberto agora" : "🔴 Fechado agora"}</span>
      <div class="stats"><div><b id="sPerf">${P.length}</b><span>perfumes</span></div><div><b id="sVend">–</b><span>vendas</span></div><div><b id="sVis">–</b><span>visitas</span></div></div>
      <div class="acts">
        <a class="btn zap" href="${waLink(L.whatsapp, "Olá! Vi o catálogo da loja e quero tirar uma dúvida.")}" target="_blank" rel="noopener">💬 WhatsApp</a>
        <a class="btn mapa" href="${mapsHref()}" target="_blank" rel="noopener">🧭 Como chegar</a>
      </div>
      <div class="promo pr" style="margin-top:12px">🔥 <span class="prT"></span> termina em <b class="cdv">--</b></div>
    </div>
    <button class="btn gold cta vertodos" id="verTodos">🛍️ Ver todos os perfumes (${P.length}) →</button>
    <div class="ganhar" id="ganhar">
      <span>🎁 Veja o que você pode ganhar</span>
      <div class="setas"><i>⌄</i><i>⌄</i></div>
    </div>
    <div class="stories" id="stories"></div>
    <div id="featSec"><div class="sec">🔥 O mais pedido</div><div class="feat" id="feat"></div></div>
    <div id="r1Sec"><div class="sec">🎡 Roleta do perfume</div>
    <div class="roleta">
      <div style="font-size:13px;color:#d6cbe6">Não sabe qual escolher? Gire e descubra o seu.</div>
      <div class="wwrap"><div class="pin"></div><div class="wheel" id="wheel"></div><div class="hub">✦</div></div>
      <button class="btn gold cta" id="girar">🎡 GIRAR A ROLETA</button>
      <div class="res" id="res"></div>
    </div></div>
    <div id="r2Sec"><div class="sec">🎁 Roleta de Prêmios</div>
    <div class="roleta">
      <div style="font-size:13px;color:#d6cbe6">Gire <b style="color:#5dfc9a">grátis</b> e ganhe um presente da loja. Toda fatia é prêmio!</div>
      <div class="wwrap"><div class="pin"></div><div class="wheel" id="wheel2" style="border-color:#5dfc9a;box-shadow:0 0 30px -6px #5dfc9a"></div><div class="hub">🎁</div></div>
      <button class="btn cta" id="girar2" style="background:linear-gradient(135deg,#5dfc9a,#1fae5b);color:#0b2414">🎁 GIRAR GRÁTIS</button>
      <div class="res" id="res2"></div>
      <p class="note">1 giro grátis por semana • prêmio válido por 7 dias • sem compra obrigatória para girar</p>
    </div></div>
    <div id="fidSec" style="display:none"><div class="sec">⭐ Cartão Fidelidade</div><div class="fidcard" id="fidCard"></div></div>
    <div id="spotSec" style="display:none"><div class="sec">🎧 Nossa playlist</div><div id="spotBox"></div></div>
    <div class="box" id="instBox" style="display:none;text-align:center;margin-top:14px">
      <b>📲 Salve a ${esc(L.nome)} no seu celular</b>
      <p style="font-size:13px;color:var(--mut);margin:6px 0 10px" id="instTxt">Fica um ícone na sua tela, igual aplicativo. Abre direto na loja, com as promoções do dia.</p>
      <button class="btn zap" id="instBtn">📲 Instalar a loja</button>
    </div>
    ${blocoLoja()}
  </section>
  <section id="cat" class="panel">
    <div class="hero" id="hero">
      <h1>${esc(L.titulo)}</h1>
      <p>Escolha sua fragrância, toque e peça direto no WhatsApp.</p>
      <div class="promo pr">🔥 <span class="prT"></span> termina em <b class="cdv">--</b></div>
    </div>
    <div class="onde" id="irLoja">📍 ${esc(L.endereco ? L.endereco.split("—").pop().trim() : "Nossa loja")} • ver a loja</div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    ${P.length ? "" : `<p class="note" style="font-size:14px;margin-top:20px">Em breve, novos perfumes por aqui ✨</p>`}
  </section>
  <p class="rodape"><a href="/comecar?ind=${encodeURIComponent(L.slug)}" style="color:inherit">Tem loja? Crie seu catálogo grátis • feito por GD</a></p>`;
  for (const id of ["cover", "hero"]) { const el = $(id); for (let i = 0; i < 16; i++) { const s = document.createElement("i"); s.className = "spark"; s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%"; s.style.animationDelay = Math.random() * 6 + "s"; el.appendChild(s); } }
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => irPara(t.dataset.v));
  $("verTodos").onclick = () => { filtro = "todos"; chips(); grid(); irPara("cat"); };
  // a seta leva direto para os prêmios: roleta de prêmios, depois cartão fidelidade, depois roleta do perfume
  $("ganhar").onclick = () => {
    const alvo = [$("r2Sec"), $("fidSec"), $("r1Sec")].find(e => e && e.style.display !== "none");
    if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const temPremio = (L.premios_on && (L.premios || []).length >= 2) || (L.fid_on && (L.fid_brinde || "").trim()) || P.filter(p => p.na_roleta && !p.esgotado).length >= 2;
  if (!temPremio) $("ganhar").style.display = "none";
  $("irLoja").onclick = () => { irPara("per"); setTimeout(() => $("loja").scrollIntoView({ behavior: "smooth" }), 50); };
  $("modal").onclick = e => { if (e.target.id === "modal") fechar(); };
  $("girar").onclick = girar1; $("girar2").onclick = girar2;
  stories(); chips(); grid(); destaque(); roda1(); roda2(); cd(); setInterval(cd, 1000); musica(); preparaInstalar(); cartaoFid();
}

function blocoLoja() {
  return `<div class="loja" id="loja">
    <div class="fach">${L.fachada_url ? `<img src="${esc(L.fachada_url)}" alt="Frente da loja">` : `<div style="font-size:60px">🏪</div>`}<span class="tag">🏪 Loja física</span></div>
    <div class="lbody"><h3>Conheça nossa loja</h3>
      ${L.endereco ? `<div class="lrow">📍 <span>${esc(L.endereco)}</span></div>` : ""}
      <div class="lrow">🕗 <span>${esc(L.horario)}</span></div>
      ${mapaEmbed()}
      <a class="btn mapa" style="margin-top:12px" href="${mapsHref()}" target="_blank" rel="noopener">🧭 Como chegar — abre o Google Maps</a>
      <p class="note">O Google Maps traça a rota de onde você está até a loja.</p>
    </div></div>`;
}

function irPara(v) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.v === v));
  document.querySelectorAll("section.panel").forEach(s => s.classList.toggle("on", s.id === v));
  window.scrollTo(0, 0);
}

const disponiveis = () => P.filter(p => !p.esgotado);
function top1() { const d = disponiveis(); if (!d.length) return null; return d.reduce((a, b) => (b.vendidos * 5 + b.cliques) > (a.vendidos * 5 + a.cliques) ? b : a); }

function stories() {
  $("stories").innerHTML = Object.entries(TEMAS).filter(([k]) => P.some(p => p.tipo === k)).map(([k, t]) => `<div class="story" data-f="${k}"><i style="background:${t.bg}">${t.n.split(" ")[0]}</i>${t.n.split(" ")[1]}</div>`).join("");
  $("stories").onclick = e => { const s = e.target.closest(".story"); if (!s) return; filtro = s.dataset.f; chips(); grid(); irPara("cat"); };
}
function chips() {
  const opts = [["todos", "✨ Todos"], ...Object.entries(TEMAS).filter(([k]) => P.some(p => p.tipo === k)).map(([k, v]) => [k, v.n])];
  $("chips").innerHTML = opts.map(([k, n]) => `<button class="chip ${filtro === k ? "on" : ""}" data-f="${k}">${n}</button>`).join("");
  $("chips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; filtro = b.dataset.f; chips(); grid(); };
}
function grid() {
  const t = top1();
  $("grid").innerHTML = P.filter(p => filtro === "todos" || p.tipo === filtro).map((p, i) => {
    const T = TEMAS[p.tipo];
    const bd = p.esgotado ? `<span class="badge esg">⛔ Esgotado</span>` : t && p.id === t.id && (t.vendidos + t.cliques) > 0 ? `<span class="badge hot">🔥 Mais pedido</span>` : p.novo ? `<span class="badge">✨ Novidade</span>` : "";
    return `<div class="card${p.esgotado ? " esg" : ""}" data-id="${p.id}" style="animation-delay:${i * 60}ms">${bd}
      <div class="scene" style="background:${T.bg}">${visual(p)}</div>
      <div class="info"><div class="nome">${esc(p.nome)}</div><div class="tipo">${T.n}</div><div class="preco">${brl(p.preco)}</div>${p.vendidos ? `<div class="vd">🛍️ ${p.vendidos} vendido${p.vendidos > 1 ? "s" : ""}</div>` : ""}</div></div>`;
  }).join("");
  $("grid").onclick = e => { const c = e.target.closest(".card"); if (c) abrir(c.dataset.id); };
}
function destaque() {
  const t = top1();
  if (!t) { $("featSec").style.display = "none"; return; }
  $("feat").innerHTML = `<div class="scene" style="background:${TEMAS[t.tipo].bg}">${visual(t)}</div><span class="badge hot" style="top:12px;left:12px">🔥 Destaque</span><div class="ov"><b>${esc(t.nome)}</b><span class="preco">${brl(t.preco)}</span> • toque para ver</div>`;
  $("feat").onclick = () => abrir(t.id);
}

function linkPerfume(p) { return `${location.origin}/p/${p.id}`; }

function abrir(id) {
  const p = P.find(x => x.id === id); if (!p) return;
  const T = TEMAS[p.tipo];
  sb.rpc("abrir_perfume", { p_perfume: p.id }).then(() => {});
  $("sheet").innerHTML = `<div class="scene" style="background:${T.bg}">${visual(p)}</div>
   <div class="sbody"><div class="tipo">${T.n}${p.esgotado ? " • ⛔ Esgotado" : ""}</div><h2>${esc(p.nome)}</h2>${p.descricao ? `<p>${esc(p.descricao)}</p>` : "<p></p>"}
   <div class="preco" style="font-size:24px;margin-bottom:14px">${brl(p.preco)}</div>
   ${p.esgotado
      ? `<button class="btn zap" id="pedir" style="background:linear-gradient(135deg,#e09a3a,#b8892e)">🔔 Me avise quando chegar</button>`
      : `${fidAtivo() && !meuZap() ? `<label style="font-size:12px;color:var(--mut)">⭐ Quer ganhar selo no cartão fidelidade? Seu WhatsApp (opcional)</label><input id="fidZapP" inputmode="tel" placeholder="97 99999 9999" style="margin-bottom:10px">` : ""}<button class="btn zap" id="pedir">💬 Pedir no WhatsApp</button>`}
   <button class="btn ghost" id="fechar">Voltar ao catálogo</button></div>`;
  $("modal").classList.add("on");
  history.replaceState(null, "", "#p-" + p.id);
  $("fechar").onclick = fechar;
  $("pedir").onclick = async () => {
    const b = $("pedir"); b.disabled = true; b.textContent = "Abrindo o WhatsApp...";
    let texto;
    if (p.esgotado) {
      await sb.rpc("avisar_quando_chegar", { p_perfume: p.id });
      texto = `Olá! Vi que o perfume *${p.nome}* está esgotado. Me avisa quando chegar? 🔔\n📸 ${linkPerfume(p)}`;
    } else {
      const campo = $("fidZapP"); if (campo && zapValido(campo.value)) salvaZap(campo.value);
      const zap = meuZap();
      const { data: cod } = await sb.rpc("registrar_pedido", { p_perfume: p.id, p_zap: zap || null });
      texto = `Olá! Quero este perfume do catálogo:\n\n🧴 *${p.nome}* — ${brl(p.preco)}\n🔖 Pedido ${cod || ""}\n📸 ${linkPerfume(p)}${zap && fidAtivo() ? `\n⭐ Cartão fidelidade: ${zapBonito(zap)}` : ""}\n\nAinda tem?`;
    }
    location.href = waLink(L.whatsapp, texto);
    setTimeout(() => { b.disabled = false; b.textContent = p.esgotado ? "🔔 Me avise quando chegar" : "💬 Pedir no WhatsApp"; }, 3000);
  };
}
function fechar() { $("modal").classList.remove("on"); history.replaceState(null, "", location.pathname + location.search); }

// Roleta do perfume
function roda1() {
  if (girando) return;
  RODA = disponiveis().filter(p => p.na_roleta).slice(0, 6);
  if (RODA.length < 2) { $("r1Sec").style.display = "none"; return; }
  desenhaRoleta($("wheel"), RODA.map(p => p.nome), RODA.map(p => TEMAS[p.tipo].b));
}
function girar1() {
  if (girando || RODA.length < 2) return; girando = true;
  const k = Math.floor(Math.random() * RODA.length);
  giraRoleta($("wheel"), R1, k, RODA.length); $("res").textContent = "Girando... ✨";
  setTimeout(() => { girando = false; const p = RODA[k]; $("res").innerHTML = `🎉 O seu é <b>${esc(p.nome)}</b>!`; setTimeout(() => abrir(p.id), 700); }, 4300);
}

// Roleta de prêmios (o servidor sorteia)
let MEU = null;
function chaveMeu() { return "premio_" + L.id; }
function lerMeu() { try { MEU = JSON.parse(localStorage.getItem(chaveMeu()) || "null"); } catch (e) { MEU = null; } }
function salvaMeu() { try { MEU ? localStorage.setItem(chaveMeu(), JSON.stringify(MEU)) : localStorage.removeItem(chaveMeu()); } catch (e) {} }
function roda2() {
  if (!L.premios_on || (L.premios || []).length < 2) { $("r2Sec").style.display = "none"; return; }
  desenhaRoleta($("wheel2"), L.premios, CORES2); lerMeu(); mostraMeu();
}
function mostraMeu() {
  const r = $("res2");
  if (!MEU) { r.innerHTML = ""; return; }
  const dias = Math.ceil((MEU.t + 7 * 864e5 - Date.now()) / 864e5);
  if (dias <= 0) { MEU = null; salvaMeu(); r.innerHTML = ""; return; }
  r.innerHTML = `🎉 Seu prêmio: <b>${esc(MEU.p)}</b><br><span style="font-size:12px;color:var(--mut)">Código ${esc(MEU.c)} • válido por mais ${dias} dia${dias > 1 ? "s" : ""}</span>
    <a class="btn zap" id="resgatar" style="margin-top:10px" href="${waLink(L.whatsapp, `Olá! Ganhei *${MEU.p}* na Roleta de Prêmios do catálogo 🎁\nCódigo: ${MEU.c}\nQuero usar!`)}" target="_blank" rel="noopener">💬 Resgatar no WhatsApp</a>`;
  $("resgatar").onclick = () => { sb.rpc("registrar_resgate", { p_loja: L.id }).then(() => {}); };
}
async function girar2() {
  if (girando2) return;
  if (MEU) { $("res2").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  girando2 = true; $("res2").textContent = "Girando... 🍀";
  const { data, error } = await sb.rpc("girar_premio", { p_loja: L.id });
  if (error || !data) { girando2 = false; $("res2").textContent = "A roleta está descansando. Tente mais tarde."; return; }
  giraRoleta($("wheel2"), R2, data.indice, L.premios.length);
  setTimeout(() => { girando2 = false; MEU = { p: data.premio, c: data.codigo, t: Date.now() }; salvaMeu(); mostraMeu(); confete(); vibra([60, 40, 120]); }, 4300);
}

// Música
function embedSpotify(u) {
  const m = String(u || "").match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album|track|artist)\/([A-Za-z0-9]+)/);
  return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}?theme=0` : null;
}
function musica() {
  const e = embedSpotify(L.spotify_url);
  if (e) { $("spotSec").style.display = ""; $("spotBox").innerHTML = `<iframe src="${e}" width="100%" height="352" frameborder="0" style="border-radius:16px" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`; }
  if (!L.musica_url) return;
  const a = new Audio(L.musica_url); a.loop = true; a.volume = 0.35;
  const b = document.createElement("button"); b.id = "somBtn"; b.textContent = "🎵 Ativar clima";
  b.style.cssText = "position:fixed;right:14px;bottom:18px;z-index:40;border:none;border-radius:30px;padding:12px 18px;font-family:inherit;font-weight:600;font-size:14px;background:linear-gradient(135deg,#f3c96b,#e09a3a);color:#1a1020;box-shadow:0 8px 24px -6px #f3c96b;cursor:pointer;animation:pulse2 1.6s infinite";
  b.onclick = async () => {
    if (a.paused) { try { await a.play(); b.textContent = "🔊 Pausar música"; b.style.animation = "none"; } catch (err) { b.textContent = "🎵 Toque de novo"; } }
    else { a.pause(); b.textContent = "🎵 Ativar clima"; }
  };
  document.body.appendChild(b);
}

// Instalar a loja no celular do cliente
function preparaInstalar() {
  if (L.icone_url) { const a = document.querySelector('link[rel="apple-touch-icon"]'); if (a) a.href = L.icone_url; const f = document.querySelector('link[rel="icon"]'); if (f) f.href = L.icone_url; }
  if (!document.querySelector('meta[name="apple-mobile-web-app-title"]')) document.head.insertAdjacentHTML("beforeend", `<meta name="apple-mobile-web-app-title" content="${esc(L.nome)}">`);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) return; // já está instalada
  const ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua), android = /android/i.test(ua);
  const dentroDeApp = /instagram|fban|fbav|fb_iab|tiktok|line\/|wv\)/i.test(ua); // navegador de dentro do Instagram/Facebook
  const dica = t => { $("instTxt").innerHTML = t; };
  $("instBox").style.display = ""; // o quadro aparece sempre, para todo cliente

  if (dentroDeApp && android) {
    dica("Para instalar, abra a loja no <b>Chrome</b>. É só tocar no botão abaixo.");
    $("instBtn").textContent = "🌐 Abrir no Chrome para instalar";
    $("instBtn").onclick = () => { location.href = `intent://${location.host}${location.pathname}#Intent;scheme=https;package=com.android.chrome;end`; };
  } else if (dentroDeApp && ios) {
    dica('Toque nos <b>⋯</b> lá em cima e em <b>"Abrir no navegador"</b>. Depois toque em <b>Compartilhar</b> ⬆️ e <b>"Adicionar à Tela de Início"</b>.');
    $("instBtn").style.display = "none";
  } else if (ios) {
    dica('No iPhone: toque em <b>Compartilhar</b> ⬆️ e depois em <b>"Adicionar à Tela de Início"</b>.');
    $("instBtn").style.display = "none";
  } else {
    $("instBtn").onclick = async () => {
      if (!window.__instalar) return dica('Toque nos <b>3 pontinhos ⋮</b> do navegador e depois em <b>"Instalar app"</b> ou <b>"Adicionar à tela inicial"</b>.');
      window.__instalar.prompt(); const r = await window.__instalar.userChoice; window.__instalar = null;
      if (r.outcome === "accepted") { $("instBox").innerHTML = "<b>✅ Loja salva no seu celular!</b>"; const b = $("instBarra"); if (b) b.remove(); }
    };
  }

  // faixa no topo, 1 vez por dia, chamando para instalar
  let visto = ""; try { visto = localStorage.getItem("inst_" + L.slug) || ""; } catch (e) {}
  if (visto === new Date().toDateString()) return;
  setTimeout(() => {
    const bar = document.createElement("div"); bar.id = "instBarra";
    bar.style.cssText = "position:fixed;left:10px;right:10px;top:10px;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#1a1226;border:1px solid #f3c96b;box-shadow:0 10px 30px -8px #000;font-size:13px";
    bar.innerHTML = `<img src="${esc(L.icone_url || L.logo_url || "/icons/icon-192.png")}" style="width:38px;height:38px;border-radius:10px;object-fit:cover">
      <div style="flex:1"><b>Instale a ${esc(L.nome)}</b><br><span style="color:var(--mut)">Ícone na sua tela, igual aplicativo</span></div>
      <button style="border:none;border-radius:20px;padding:9px 14px;font-family:inherit;font-weight:600;background:linear-gradient(135deg,#f3c96b,#e09a3a);color:#1a1020">Instalar</button>
      <span style="cursor:pointer;padding:4px 6px;color:var(--mut)">✕</span>`;
    const fecha = () => { bar.remove(); try { localStorage.setItem("inst_" + L.slug, new Date().toDateString()); } catch (e) {} };
    bar.querySelector("span:last-child").onclick = fecha;
    bar.querySelector("button").onclick = () => { fecha(); if (window.__instalar || (dentroDeApp && android)) $("instBtn").click(); else $("instBox").scrollIntoView({ behavior: "smooth", block: "center" }); };
    document.body.appendChild(bar);
  }, 4000);
}

// ===== Cartão Fidelidade =====
const fidAtivo = () => !!(L.fid_on && (L.fid_brinde || "").trim());
const zapValido = z => /^\d{10,11}$/.test(String(z || "").replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, ""));
function meuZap() { try { return localStorage.getItem("meu_zap") || ""; } catch (e) { return ""; } }
function salvaZap(z) { try { localStorage.setItem("meu_zap", String(z).replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "")); } catch (e) {} }
function zapBonito(z) { const d = String(z).replace(/\D/g, "").slice(-11); return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d; }
function vibra(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
async function cartaoFid() {
  if (!fidAtivo()) return;
  $("fidSec").style.display = "";
  const meta = Math.max(3, Math.min(30, L.fid_meta || 10)), zap = meuZap(), brinde = esc(L.fid_brinde);
  const selosHTML = (n, novo) => Array.from({ length: meta }, (_, i) => `<span class="selo${i < n ? " on" : ""}${novo && i === n - 1 ? " novo" : ""}" style="animation-delay:${i * 60}ms">${i < n ? "⭐" : ""}</span>`).join("");
  if (!zap) {
    $("fidCard").innerHTML = `<div class="fidtop">A cada <b>${meta} compras</b> você ganha:<div class="fidbrinde">🎁 ${brinde}</div></div>
      <div class="selos">${selosHTML(0)}</div>
      <label style="font-size:12px;color:var(--mut)">Seu WhatsApp, para guardar seus selos</label>
      <input id="fidZap" inputmode="tel" placeholder="97 99999 9999">
      <button class="btn gold" id="fidAtivar" style="margin-top:10px">⭐ Ativar meu cartão</button>
      <p class="note">Cada compra confirmada pela loja vira um selo. É grátis.</p>`;
    $("fidAtivar").onclick = () => { const v = $("fidZap").value; if (!zapValido(v)) { toast("Coloque seu WhatsApp com DDD 😉"); return; } salvaZap(v); vibra(30); cartaoFid(); };
    return;
  }
  $("fidCard").innerHTML = `<div class="selos">${selosHTML(0)}</div><p class="note">Carregando seus selos...</p>`;
  const { data } = await sb.rpc("meu_cartao", { p_loja: L.id, p_zap: zap });
  const c = (data && data[0]) || { selos: 0, meta, brinde: L.fid_brinde, brindes: 0 };
  const n = Math.min(c.selos, meta), falta = Math.max(0, meta - c.selos);
  const visto = (() => { try { const v = localStorage.getItem("fid_vi_" + L.id); return v === null ? null : +v; } catch (e) { return null; } })();
  const ganhouSelo = visto !== null && c.selos > visto; // só comemora selo NOVO, não na primeira visita try { localStorage.setItem("fid_vi_" + L.id, c.selos); } catch (e) {}
  $("fidCard").innerHTML = `<div class="fidtop">${falta === 0 ? `<div class="fidok">🎉 Cartão completo!</div>Você ganhou:` : `Faltam <b class="fidn">${falta}</b> para ganhar:`}<div class="fidbrinde">🎁 ${brinde}</div></div>
    <div class="selos">${selosHTML(n, ganhouSelo)}</div>
    <div class="fidbar"><i style="width:${Math.round(n / meta * 100)}%"></i></div>
    ${falta === 0 ? `<p style="font-size:13px;margin-top:10px">Mostre esta tela na loja ou chame no WhatsApp para retirar seu brinde.</p><a class="btn zap" style="margin-top:8px" href="${waLink(L.whatsapp, `Olá! Completei meu cartão fidelidade ⭐ (${zapBonito(zap)}). Quero retirar meu brinde: ${L.fid_brinde} 🎁`)}" target="_blank" rel="noopener">🎁 Quero meu brinde</a>` : ""}
    <p class="note">${c.brindes ? `Você já ganhou ${c.brindes} brinde${c.brindes > 1 ? "s" : ""} aqui 💛 • ` : ""}Cartão de ${zapBonito(zap)} • <a href="#" id="fidTroca" style="color:inherit">trocar número</a></p>`;
  $("fidTroca").onclick = e => { e.preventDefault(); try { localStorage.removeItem("meu_zap"); } catch (er) {} cartaoFid(); };
  if (falta === 0 || ganhouSelo) setTimeout(() => { confete(); vibra([40, 30, 80]); }, 500);
}

// Confete dourado
function confete() {
  const cores = ["#f3c96b", "#ff5fa2", "#9b7bff", "#5dfc9a", "#ffffff"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("i"); c.className = "confete";
    c.style.left = Math.random() * 100 + "vw"; c.style.background = cores[i % cores.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + "s"; c.style.animationDelay = Math.random() * 0.4 + "s";
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}

// Promoção
function cd() {
  const fim = L.promo_fim ? new Date(L.promo_fim) : null;
  let d = fim ? Math.floor((fim - new Date()) / 1000) : 0; const ativa = L.promo_on && d > 0;
  document.querySelectorAll(".pr").forEach(e => e.style.display = ativa ? "" : "none"); if (!ativa) return;
  const dd = Math.floor(d / 86400), h = Math.floor(d % 86400 / 3600), m = Math.floor(d % 3600 / 60), s = d % 60;
  const t = (dd ? dd + "d " : "") + `${p2(h)}:${p2(m)}:${p2(s)}`;
  const html = t.split("").map(c => /\d/.test(c) ? `<i class="dg">${c}</i>` : `<i class="sp">${c}</i>`).join("");
  document.querySelectorAll(".cdv").forEach(e => { if (e.dataset.t !== t) { e.dataset.t = t; e.innerHTML = html; } });
  document.querySelectorAll(".prT").forEach(e => e.textContent = L.promo_titulo);
}

iniciar();
</script>
</body>
